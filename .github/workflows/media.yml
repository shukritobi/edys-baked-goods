name: Sync original bakery media
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/media.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate originals
        run: |
          mkdir -p assets
          python -m pip install Pillow
          python - <<'PY'
          import urllib.request, io
          from PIL import Image
          from pathlib import Path
          base='https://edysbakednfood.orderla.my/storage/'
          files={
              'hero':'https://orderla.my/storage//products/CpSitCypmn0hRqGm91S7PwBCtYvOU4mfQf3dr8Sq.jpeg',
              'story':'https://orderla.my/storage//products/4813/A4UpygmlX7HE75AdXGMUUqidgHOvGl96MWfAUFV7.jpg',
              'walnut':base+'products/4813/8td5oyce6D0JckVB3yvAo4NTGj2OrJKOYqncycti.jpg',
              'coklat':base+'products/4813/8zSJ6vvwkJ8EkjNY1mv2tHciKdLTKg9Ql6myH9nS.jpg',
              'double':base+'block/products/4813/aQ8ArSyup2MZ51sVsBLDglc13rKnhDH8VKgOh2iU.jpg',
              'chocwalnut':base+'block/products/4813/20240315111319-209257.jpg',
              'buah':base+'products/3KVcHNxWCuHb7tBgHODhbE9GkytZgbBYfypTCCJG.jpeg',
              'suji':base+'products/4813/5bLiScItYU8t9ujvcpxF00g4NrFDopwlkqbHJipN.jpg'
          }
          failures=[]
          for name,url in files.items():
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=25) as r:
                      data=r.read(15000000)
                  im=Image.open(io.BytesIO(data)).convert('RGB')
                  im.thumbnail((1400,1400))
                  im.save(Path('assets')/(name+'.jpg'),quality=86,optimize=True)
                  print(name,im.size)
              except Exception as e:
                  failures.append(name)
                  print(name,e)
          if failures:
              print('::warning::Unavailable originals: '+', '.join(failures))
          PY
      - name: Commit downloaded media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m "Cache original Edy's bakery media"
            git push origin HEAD:main
          fi
